# docker-compose per test: sostituisce il servizio frontend con mock-frontend

services:
  database:
    image: database:1.0
    build:
      context: ../
      dockerfile: ./docker/database/dockerfile
    container_name: database-container
    env_file:
      - ../docker/.env
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      - transcendence

  backend:
    depends_on:
      - database
    image: backend:1.0
    build:
      context: ../
      dockerfile: ./docker/backend/dockerfile
    container_name: backend-container
    env_file:
      - ../docker/.env
    volumes:
      - ../src/backend:/usr/src/app
      - /usr/src/app/node_modules
    ports:
      - 3000:3000
    networks:
      - transcendence

  mock-frontend:
    depends_on:
      - backend
    image: mock-frontend:1.0
    build:
      context: .
      dockerfile: ./mock-frontend-docker/dockerfile
    container_name: mock-frontend-container
    volumes:
      - ./mock-frontend:/usr/src/app
    ports:
      - 5173:5173
    networks:
      - transcendence

networks:
  transcendence:
    driver: bridge

volumes:
  db_data:
