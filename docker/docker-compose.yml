# version: '3.8'

services:
# il contex è necessario che sia ../ altrimenti il dockerfile usa come default la posizione del docker-compose e non puo andare piu indietro dalla posizione del di partenza

#------------------------------------------------------------------------------#
#                               DATABASE
  database:
    image: database:1.0
    build:
      context: ../
      dockerfile: ./docker/database/dockerfile
    container_name: database-container
    ports:
      - 5432:5432 # da togliere in consegna, serve solo per testare le API
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - transcendence

#------------------------------------------------------------------------------#
#                               BACKEND
  backend:
    depends_on:
      - database
    image: backend:1.0
    build:
      context: ../
      dockerfile: ./docker/backend/dockerfile
    container_name: backend-container
    ports:
      - 3000:3000 # da togliere in consegna, serve solo per testare le API
    env_file:
      - .env
    volumes:
      - ../src/backend:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - transcendence


#------------------------------------------------------------------------------#
#                               FRONTEND
  frontend:
    depends_on:
      - backend
    image: frontend:1.0
    build:
      context: ../
      dockerfile: ./docker/frontend/dockerfile
    container_name: frontend-container
    volumes:
      - ../src/frontend:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - transcendence


#------------------------------------------------------------------------------#
#                               NGINX
  nginx:
    depends_on:
      - frontend
    image: nginx:1.0
    build:
      context: ../
      dockerfile: ./docker/nginx/dockerfile
    container_name: nginx-container
    ports:
      - 8443:8443
    networks:
      - transcendence

#------------------------------------------------------------------------------#
#                               NETWORKS
networks:
  transcendence:
    driver: bridge

#------------------------------------------------------------------------------#
#                               VOLUMES
volumes:
  db_data: