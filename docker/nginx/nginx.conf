# NGINX configuration file

# Run worker processes as nginx user
#user					nginx;

# Automatically determine the number of worker processes based on available 
# CPU cores
#worker_processes		auto;

# Global error log directed to stderr for Docker container logging
#error_log				/dev/stderr	notice;

# PID file path
#pid						/run/nginx.pid;

# Events context
#events {
	# Maximum number of simultaneous connections handled by each worker process
#	worker_connections	1024;
#}

# HTTP context
# USELESS -> http {
	# Maps file extensions to MIME types so browsers render content correctly
	# USELESS -> include				/etc/nginx/mime.types;
	# USELESS -> default_type		application/octet-stream;

	# Custom access log format
	# USELESS -> log_format	access	'$remote_addr - $remote_user [$time_local] "$request" '
	# USELESS -> 					'$status $body_bytes_sent "$http_referer" '
	# USELESS -> 					'"$http_user_agent" "$http_x_forwarded_for"';

	# Direct access and error logs to standard streams for Docker log collection
	# USELESS -> access_log			/dev/stdout	access;
	# USELESS -> error_log			/dev/stderr	warn;

	# Optimization directives for sending static files
	# USELESS -> sendfile			on;	
	# Hide Nginx version in headers and error pages for security
	server_tokens		off;
	# USELESS -> keepalive_timeout	65;

	# Map for WebSocket connection upgrading.
	# Ensures 'Connection: upgrade' is ONLY sent when 'Upgrade' header is present,
	# preventing broken keep-alive on regular HTTP requests.
	map $http_upgrade $connection_upgrade {
		default upgrade;
		''      close;
# USELESS -> 	}

	# HTTPS Server Block
	server {
		# Bind virtual server to TCP port 443 with TLS enabled
		listen 8443 ssl;			# IPv4 support
		listen [::]:8443 ssl;	# IPv6 support

		# Server certificate and private key used for TLS handshake
		ssl_certificate		/etc/nginx/ssl/server.crt;
		ssl_certificate_key	/etc/nginx/ssl/server.key;

		# Secure TLS protocol versions (TLS 1.2 and 1.3 for security and broad 
		# compatibility)
		ssl_protocols		TLSv1.2 TLSv1.3;
#adding:
		ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
		ssl_prefer_server_ciphers  on;
		ssl_session_cache          shared:SSL:10m;
		ssl_session_timeout        10m;

		# Internal healthcheck endpoint for Docker healthcheck probe
		location = /healthz {
			access_log			off;
			default_type		text/plain;
			return 200			"healthy\n";
		}

		# Backend API proxy pass: forwards /api/... directly to NestJS
		# TODO: remove access to internal APIs in production!
		location /api/ {
			proxy_pass			http://backend:3000;
			proxy_http_version	1.1;
			proxy_set_header	Host				$http_host;
			proxy_set_header	X-Real-IP			$remote_addr;
			proxy_set_header	X-Forwarded-For		$proxy_add_x_forwarded_for;
			proxy_set_header	X-Forwarded-Proto	$scheme;

			# Dynamic WebSocket upgrade support
			proxy_set_header	Upgrade				$http_upgrade;
			proxy_set_header	Connection			$connection_upgrade;
#added
			proxy_hide_header  X-Powered-By;
		} 

		# Application frontend proxy pass: forwards requests to Vite dev server
		location / {
			proxy_pass			http://frontend:5173;
			proxy_http_version	1.1;
			proxy_set_header	Host				$host;
			proxy_set_header	X-Forwarded-Host	$host;
			proxy_set_header	X-Forwarded-Proto	$scheme;
			proxy_set_header	X-Forwarded-For		$proxy_add_x_forwarded_for;

			# Dynamic WebSocket upgrade support (Vite HMR)
			proxy_set_header	Upgrade				$http_upgrade;
			proxy_set_header	Connection			$connection_upgrade;

			proxy_read_timeout	86400;
			proxy_buffering		off;
		}
		# Easter egg
		add_header			X-Cook						"WeCook!";
		#adding
		add_header  X-Content-Type-Options     "nosniff" always;
		add_header  X-Frame-Options            "SAMEORIGIN" always;
		add_header  Referrer-Policy            "strict-origin-when-cross-origin" always;
		add_header  Strict-Transport-Security  "max-age=300" always;
	}

	server {
		listen 8080;			# IPv4 support
		listen [::]:8080;	# IPv6 support
		server_name _; #the underscore is a common catch-all name, so it matches any host.
		return 301 https://$host:8443$request_uri;
	}
}