# NGINX configuration file

# ...
user					nginx;

# ...
worker_processes		auto;

# ...
error_log				/var/log/nginx/error.log	notice;

# PID file path
pid						/run/nginx.pid;

# Events context
events {

	# Maximum number of simultaneous connections handled by each worker process.
	# A worker is a running Nginx process that handles client requests.
	worker_connections	1024;
}

# HTTP context
http {

	# Maps extensions to Content-Type. In other words, this helps Nginx know
	# file types (.html, .jpg, .css) so browsers treat them correctly.
	include				/etc/nginx/mime.types;

	# Default type application/octet-stream is fallback when no type matches.
	default_type		application/octet-stream;

	# Format for access logs
	log_format			access	'$remote_addr - $remote_user [$time_local] "$request" '
								'$status $body_bytes_sent "$http_referer" '
								'"$http_user_agent" "$http_x_forwarded_for"';

	# Log accesses to the website
	access_log			/var/log/nginx/access.log	access;

	# Log errors to log file and to stderr for Docker container log capture.
	error_log			/var/log/nginx/error.log	warn;
	error_log			/dev/stderr					warn;

	# ...
	sendfile			on;

	# ...
	# tcp_nopush			on;

	# Timeouts
	keepalive_timeout	65;

	# ...
	# gzip				on;

	# Default server. Serves the application
	server {

		# Bind this virtual server to TCP port 443 with TLS enabled.
		listen 443 ssl;			# IPv4 support
		listen [::]:443 ssl;	# IPv6 support

		# Server certificate and private key used for TLS handshake.
		ssl_certificate		/etc/nginx/ssl/transcendence.crt;
		ssl_certificate_key	/etc/nginx/ssl/transcendence.key;

		# Restrict TLS negotiation to version 1.3 only.
		ssl_protocols		TLSv1.3;

		# Internal APIs proxy pass (needs to be removed in production)
		# Forwards /api/... directly to NestJS (which uses app.setGlobalPrefix('api'))
		location /api/ {
			proxy_pass			http://backend:3000;
			proxy_http_version	1.1;
			proxy_set_header	Host				$http_host;
			proxy_set_header	X-Real-IP			$remote_addr;
			proxy_set_header	X-Forwarded-For		$proxy_add_x_forwarded_for;
			proxy_set_header	X-Forwarded-Proto	$scheme;
			# WebSocket support
			proxy_set_header	Upgrade				$http_upgrade;
			proxy_set_header	Connection			"upgrade";
			# ---
		} 

		# Application frontend proxy pass
		location / {
			proxy_pass			http://frontend:5173;
			proxy_http_version	1.1;
			proxy_set_header	Host				$host;
			proxy_set_header	X-Forwarded-Host	$host;
			proxy_set_header	X-Forwarded-Proto	$scheme;
			proxy_set_header	X-Forwarded-For		$proxy_add_x_forwarded_for;
			# WebSocket support
			proxy_set_header	Upgrade				$http_upgrade;
			proxy_set_header	Connection			"upgrade";
			# ---
			proxy_read_timeout	86400;
			proxy_buffering		off;
		}

		# Hide Nginx version in error pages and response headers (security).
		server_tokens		off;

		# Easter egg :). See it with 'curl -kI <host>'
		add_header			X-Cook						"WeCook!";
	}
}