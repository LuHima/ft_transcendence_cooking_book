# NGINX configuration file template
# Inserted into http{} block inside modsecurity nginx config file

# Custom access log format
log_format	access	'$remote_addr - $remote_user [$time_local] "$request" '
					'$status $body_bytes_sent "$http_referer" '
					'"$http_user_agent" "$http_x_forwarded_for"';

# Direct access and error logs to standard streams for Docker log collection
access_log			/dev/stdout	access;
error_log			/dev/stderr	notice;

# Hide Nginx version in headers and error pages for security
server_tokens		off;

# Map for WebSocket connection upgrading.
# Ensures 'Connection: upgrade' is ONLY sent when 'Upgrade' header is
# present, preventing broken keep-alive on regular HTTP requests.
map $http_upgrade $connection_upgrade {
	default upgrade;
	''      close;
}

# HTTPS server block
server {
	# Bind virtual server to TCP port 8443 with TLS enabled
	listen 8443 ssl;		# IPv4 support
	listen [::]:8443 ssl;	# IPv6 support

	# Server certificate and private key used for TLS handshake
	ssl_certificate		/etc/nginx/conf/transcendence.crt;
	ssl_certificate_key	/etc/nginx/conf/transcendence.key;

	# Secure TLS protocol versions (TLS 1.2 and 1.3 for security and broad 
	# compatibility)
	ssl_protocols		TLSv1.2 TLSv1.3;

	# SSL Ciphers
	ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
	ssl_prefer_server_ciphers  on;
	ssl_session_cache          shared:SSL:10m;
	ssl_session_timeout        10m;

	# Maximum upload size (recipe photos/videos). nginx's default is 1m,
	# which makes any bigger upload fail with 413.
	client_max_body_size	100m;

	# Internal healthcheck endpoint for Docker healthcheck probe
	location = /healthz {
		access_log			off;
		default_type		text/plain;
		return 200			"healthy\n";
	}

	# Backend API proxy pass: forwards /api/... directly to NestJS
	# TODO: remove access to internal APIs in production!
	location /api/ {
		proxy_pass			http://backend:3000;
		proxy_http_version	1.1;
		proxy_set_header	Host				$http_host;
		proxy_set_header	X-Real-IP			$remote_addr;
		proxy_set_header	X-Forwarded-For		$proxy_add_x_forwarded_for;
		proxy_set_header	X-Forwarded-Proto	$scheme;
		proxy_hide_header	X-Powered-By;

		# Dynamic WebSocket upgrade support
		proxy_set_header	Upgrade				$http_upgrade;
		proxy_set_header	Connection			$connection_upgrade;
	}

	# Uploaded media (avatars, recipe images and videos) is served by the
	# backend under /uploads/. Without this block the request would reach
	# the frontend and return index.html instead of the file.
	location /uploads/ {
		proxy_pass			http://backend:3000;
		proxy_http_version	1.1;
		proxy_set_header	Host				$http_host;
		proxy_set_header	X-Real-IP			$remote_addr;
		proxy_set_header	X-Forwarded-For		$proxy_add_x_forwarded_for;
		proxy_set_header	X-Forwarded-Proto	$scheme;
		proxy_hide_header	X-Powered-By;
	}

	# Application frontend proxy pass: forwards requests to Vite dev server
	location / {
		proxy_pass			http://frontend:5173;
		proxy_http_version	1.1;
		proxy_set_header	Host				$host;
		proxy_set_header	X-Forwarded-Host	$host;
		proxy_set_header	X-Forwarded-Proto	$scheme;
		proxy_set_header	X-Forwarded-For		$proxy_add_x_forwarded_for;
		proxy_hide_header	X-Powered-By;

		# Dynamic WebSocket upgrade support (Vite HMR)
		proxy_set_header	Upgrade				$http_upgrade;
		proxy_set_header	Connection			$connection_upgrade;

		proxy_read_timeout	86400;
		proxy_buffering		off;
	}

	# Easter egg
	add_header			X-Cook				"WeCook!";

	# Security
	add_header	X-Content-Type-Options		"nosniff" always;
	add_header	X-Frame-Options				"SAMEORIGIN" always;
	add_header	Referrer-Policy				"strict-origin-when-cross-origin" always;
	add_header	Strict-Transport-Security	"max-age=300" always;
}

# HTTP server block
server {
	listen 8080;		# IPv4 support
	listen [::]:8080;	# IPv6 support
	server_name _;		# The underscore is a common catch-all name, so it matches any host.
	return 301 https://$host:8443$request_uri;
}
