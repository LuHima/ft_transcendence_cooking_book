      <stop offset="0%" stop-color="#0a4664" />
      <stop offset="18%" stop-color="#105e74" />
      <stop offset="38%" stop-color="#18787c" />
      <stop offset="65%" stop-color="#359877" />
      <stop offset="85%" stop-color="#5eb66e" />
      <stop offset="100%" stop-color="#77c576" />
